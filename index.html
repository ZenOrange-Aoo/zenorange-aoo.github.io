
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台首页</title>
    <!--公共样式-->
    <link rel="stylesheet" href="common.css">
    <!--首页专属样式-->
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="layout">
    <!-- 左侧侧边栏：由 layout.js 注入，三页共用 -->
    <div id="sidebar-mount"></div>
    <!-- 右侧整体：头部 + 页面主体 -->
    <div class="right-wrap">
        <header class="top-header">系统管理员</header>
        <div class="main">
            <h2>工作台首页</h2>
            <!-- 统计卡片区域 -->
            <div class="card-wrap">
                <div class="stat-card">
                    <div class="title">年度累计收费（元）</div>
                    <div class="num" id="yearFee">0</div>
                </div>
                <div class="stat-card">
                    <div class="title">入驻企业总数</div>
                    <div class="num" id="companyCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="title">一体杆总数</div>
                    <div class="num" id="poleCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="title">月卡车辆总数</div>
                    <div class="num" id="totalMonthCard">0</div>
                </div>
            </div>
            <!-- 快捷入口模块 -->
            <div class="quick-wrap">
                <h3>快捷入口</h3>
                <div class="quick-list">
                    <a class="quick-item" href="addMonthCard.html">新增月卡</a>
                    <a class="quick-item" href="monthCard.html">月卡管理</a>
                    <a class="quick-item" href="javascript:;">停车缴费</a>
                    <a class="quick-item" href="javascript:;">区域管理</a>
                </div>
            </div>
            <!-- 预留扩展占位容器 -->
            <div class="ext-box">此处为预留扩展区域，可承载后续新增功能模块</div>
        </div>
    </div>
</div>
<!--公共布局脚本（注入 sidebar + 菜单交互），必须在页面脚本之前-->
<script src="layout.js"></script>
<script src="index.js"></script>
</body>
</html>
